name: Bug Report
description: Report a bug or issue with the userbot
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: The userbot crashes when I use the /clone command
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Send .clone command in a group
        2. Reply to a user's message
        3. Bot throws KeyError
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Bot should clone the user's profile successfully
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Bot crashes with KeyError for photo attribute
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: If applicable, paste any error messages or logs here
      render: shell

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.13"

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Local
        - Heroku
        - Docker
        - VPS
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information
