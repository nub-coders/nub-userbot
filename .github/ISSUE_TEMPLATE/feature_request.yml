name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature or enhancement would you like to see?
      placeholder: Add support for Spotify downloads
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: How would this feature help you or other users?
      placeholder: Many users want to download songs from Spotify playlists directly
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there other ways to accomplish this?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant details, mockups, or examples
