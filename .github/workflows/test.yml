name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # System libs the imports need at module load (mirrors Dockerfile):
      # python-magic -> libmagic1, media helpers -> ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y libmagic1 ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (scoped gate — see ruff.toml)
        run: pip install ruff && ruff check .
      - name: Tests
        run: pytest -q
